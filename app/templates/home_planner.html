{% extends 'base.html' %}{% block title %}Home Planner{% endblock %}{% block content %}<div class="layout"><form id="homeForm" class="card"><small>HOME INTERIOR</small><h1>Build your home plan</h1><label>Budget ₹<input id="budget" type="number" min="1" required></label><label>Rooms<input id="rooms" placeholder="Living Room, Bedroom, Kitchen" required></label><label>Style<select id="style"><option>Modern</option><option>Minimal</option><option>Traditional</option><option>Contemporary</option></select></label><label>Priorities<textarea id="priorities" placeholder="Affordable, durable, elegant..."></textarea></label><label>Items<input id="items" placeholder="lights:4, fans:2"></label><button class="btn">Generate Plan ✨</button></form><div id="result"><p class="empty">Recommendations will appear here.</p></div></div>{% endblock %}{% block scripts %}<script>homePlanner()</script>{% endblock %}

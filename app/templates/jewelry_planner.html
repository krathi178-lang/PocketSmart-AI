{% extends 'base.html' %}{% block title %}Jewelry Planner{% endblock %}{% block content %}<div class="layout"><form id="jewelryForm" class="card" enctype="multipart/form-data"><small>JEWELRY MATCH</small><h1>Find your match</h1><label>Budget ₹<input name="budget" type="number" min="1" required></label><label>Occasion<input name="occasion" value="Wedding"></label><label>Style<select name="style"><option>Elegant</option><option>Minimal</option><option>Traditional</option><option>Statement</option><option>Western</option></select></label><label>Outfit description<textarea name="outfit_description" placeholder="Cream saree with green border..."></textarea></label><label>Outfit image<input name="outfit_image" type="file" accept="image/jpeg,image/png,image/webp"></label><button class="btn">Generate Jewelry Plan ✨</button></form><div id="result"><p class="empty">Upload an outfit image for optional visual matching.</p></div></div>{% endblock %}{% block scripts %}<script>jewelryPlanner()</script>{% endblock %}
